const routePages = {
  p3a:2, p3b:3,
  p5a:4, p5b:7
};

let current = Number(localStorage.getItem("mysteryCurrent") || 0);
let history = JSON.parse(localStorage.getItem("mysteryHistory") || "[]");
let choices = JSON.parse(localStorage.getItem("mysteryChoices") || "{}");

function save(){
  localStorage.setItem("mysteryCurrent", current);
  localStorage.setItem("mysteryHistory", JSON.stringify(history));
  localStorage.setItem("mysteryChoices", JSON.stringify(choices));
}

function choose(target, label){
  choices[current]=label;
  history.push(current);
  current=routePages[target];
  save();
  render();
}

function next(){
  if(current===3 || current===2) current=4;
  else if(current===4) current=5;
  else if(current===5) current=6;
  else if(current===6) current=7;
  else if(current===7) current=8;
  else if(current===8) current=9;
  else if(current===9) current=10;
  else if(current===10) current=11;
  else if(current===11) current=12;
  else if(current===12) current=13;
  else if(current===13) current=14;
  else if(current===14) current=15;
  else if(current===15) current=16;
  else if(current===16) current=17;
  else if(current===17) current=18;
  else if(current===0) current=1;
  else if(current===1) return;
  save(); render();
}

function back(){
  if(history.length){
    current=history.pop();
    save(); render();
  }else if(current>0){
    current--;
    save(); render();
  }
}

function render(){
  const p=pages[current];
  document.getElementById("chapterLabel").textContent =
    p.title==="الباب" ? "الفصل الثالث — المسار الأول" :
    p.title==="الصالة الفارغة" ? "الفصل الثالث — المسار الثاني" :
    p.title==="موعد المبارزة" ? "الفصل الخامس — الخيار الأول" :
    p.title==="صاحب الإعلان" ? "الفصل الخامس — الخيار الثاني" :
    p.title==="الساحة التي لا يصلها ظل" ? "الفصل السادس — الخيار الأول" :
    p.title==="الاسم الآخر" ? "الفصل السادس — الخيار الثاني" :
    p.title==="الشخص الذي يحمل اسمي" ? "الفصل السابع — الخيار الأول" :
    p.title==="الرسالة التي لم تُرسل" ? "الفصل السابع — الخيار الثاني" :
    "الفصل " + (current<4? ["الأول","الثاني","الثالث","الثالث"][current] : current-0);

  let html=`<h2>${p.title}</h2><div class="story">${p.content}</div>`;

  if(p.choices){
    html+=`<div class="choiceTitle">اختاري كيف تواصلين الحكاية</div><div class="choices">`;
    p.choices.forEach(c=>{
      html+=`<button onclick="choose('${c[1]}','${c[0].replace(/'/g,"’")}')">${c[0]}</button>`;
    });
    html+=`</div>`;
  }else if(!p.end){
    html+=`<div class="nav"><button class="back" onclick="back()">↩ العودة</button><button class="next" onclick="next()">متابعة الحكاية ←</button></div>`;
  }else{
    html+=`<div class="ending"><h3>النهاية... أم بداية أخرى؟</h3><p>انتهت الحكاية هنا، لكن الباب لم يُغلق تمامًا.</p><button onclick="current=0;history=[];save();render()">إعادة الحكاية</button></div>`;
  }

  html+=`<div class="note">الاختيارات تُحفظ على هذا الجهاز.</div>`;
  document.getElementById("app").innerHTML=html;
  document.getElementById("progressBar").style.width=((current+1)/pages.length*100)+"%";
  window.scrollTo({top:0,behavior:"smooth"});
}
render();
</script>
</body>
</html>

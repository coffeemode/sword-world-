<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ما وراء باب الاستقبال</title>

<style>
  :root{
    --navy:#07111f;
    --navy2:#0c1b2d;
    --navy3:#10243a;
    --gold:#d6b46a;
    --gold-light:#f0d99b;
    --cream:#eee9dc;
    --muted:#9b9a96;
  }

  *{
    box-sizing:border-box;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    margin:0;
    min-height:100vh;
    color:var(--cream);
    font-family:"Noto Naskh Arabic","Amiri",Tahoma,serif;
    line-height:2.05;
    background:
      radial-gradient(circle at 50% 10%, rgba(214,180,106,.14), transparent 28%),
      radial-gradient(circle at 15% 75%, rgba(24,65,100,.20), transparent 32%),
      linear-gradient(145deg,var(--navy),var(--navy2) 52%,#040a12);
    overflow-x:hidden;
  }

  body::before,
  body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:0;
  }

  body::before{
    width:260px;
    height:260px;
    right:-120px;
    top:20%;
    border:1px solid rgba(214,180,106,.10);
    border-radius:50%;
    box-shadow:
      0 0 90px rgba(214,180,106,.05),
      0 0 0 35px rgba(214,180,106,.025),
      0 0 0 70px rgba(214,180,106,.018);
  }

  body::after{
    width:1px;
    height:55vh;
    left:7%;
    top:20%;
    background:linear-gradient(
      transparent,
      rgba(214,180,106,.15),
      transparent
    );
  }

  .wrap{
    position:relative;
    z-index:1;
    max-width:900px;
    margin:auto;
    padding:34px 16px 60px;
  }

  .book{
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(
        180deg,
        rgba(12,27,45,.96),
        rgba(7,17,31,.98)
      );
    border:1px solid rgba(214,180,106,.42);
    border-radius:4px;
    box-shadow:
      0 30px 90px rgba(0,0,0,.58),
      inset 0 0 0 1px rgba(255,255,255,.025);
  }

  .book::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(214,180,106,.10);
    pointer-events:none;
  }

  .top{
    position:relative;
    padding:42px 26px 25px;
    text-align:center;
    border-bottom:1px solid rgba(214,180,106,.18);
    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(214,180,106,.09),
        transparent 45%
      );
  }

  .top::after{
    content:"";
    position:absolute;
    bottom:-1px;
    right:50%;
    transform:translateX(50%);
    width:120px;
    height:2px;
    background:
      linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
  }

  .mark{
    position:relative;
    display:inline-block;
    color:var(--gold);
    font-size:31px;
    line-height:1;
    margin-bottom:12px;
    filter:drop-shadow(
      0 0 8px rgba(214,180,106,.22)
    );
  }

  .mark::before,
  .mark::after{
    content:"";
    position:absolute;
    top:50%;
    width:62px;
    height:1px;
    background:
      linear-gradient(
        90deg,
        transparent,
        var(--gold)
      );
  }

  .mark::before{
    right:42px;
  }

  .mark::after{
    left:42px;
    transform:scaleX(-1);
  }

  h1{
    margin:0;
    color:var(--gold-light);
    font-size:34px;
    font-weight:700;
    letter-spacing:.3px;
    text-shadow:0 2px 20px rgba(0,0,0,.35);
  }

  #chapterLabel{
    margin-top:8px;
    color:var(--muted);
    font-size:15px;
  }

  .progress{
    height:3px;
    background:rgba(255,255,255,.045);
  }

  #progressBar{
    height:100%;
    width:0;
    background:
      linear-gradient(
        90deg,
        var(--gold),
        var(--gold-light),
        var(--gold)
      );
    box-shadow:0 0 12px rgba(214,180,106,.35);
    transition:width .45s ease;
  }

  main{
    position:relative;
    padding:42px 42px 36px;
  }

  main::before{
    content:"✦";
    position:absolute;
    top:19px;
    right:50%;
    transform:translateX(50%);
    color:rgba(214,180,106,.42);
    font-size:12px;
  }

  h2{
    color:var(--gold-light);
    text-align:center;
    font-size:28px;
    font-weight:700;
    margin:0 0 30px;
  }

  h2::after{
    content:"";
    display:block;
    width:70px;
    height:1px;
    margin:12px auto 0;
    background:
      linear-gradient(
        90deg,
        transparent,
        var(--gold),
        transparent
      );
  }

  .story{
    max-width:720px;
    margin:auto;
  }

  .story p{
    margin:0 0 20px;
    font-size:18px;
    color:var(--cream);
  }

  .gold{
    color:var(--gold-light);
    text-shadow:0 0 18px rgba(214,180,106,.08);
  }

  .dialogue{
    margin:22px 0;
    padding:11px 18px;
    border-right:2px solid currentColor;
    background:
      linear-gradient(
        90deg,
        rgba(255,255,255,.025),
        rgba(255,255,255,.055)
      );
    border-radius:2px;
  }

  .hero{
    color:var(--cream);
  }

  .masked{
    color:#c2c4cb;
  }

  .old{
    color:#78c995;
  }

  .girl{
    color:#79dced;
  }

  .watch{
    color:#e6c875;
  }

  .guard{
    color:#c8a2e8;
  }

  .other{
    color:#e7e7e7;
  }

  .choiceTitle{
    color:var(--gold);
    text-align:center;
    margin:38px 0 16px;
    font-size:17px;
  }

  .choices{
    display:grid;
    gap:13px;
    max-width:720px;
    margin:auto;
  }

  button{
    width:100%;
    border:1px solid rgba(214,180,106,.48);
    background:
      linear-gradient(
        135deg,
        rgba(214,180,106,.10),
        rgba(214,180,106,.025)
      );
    color:var(--cream);
    padding:15px 19px;
    border-radius:2px;
    cursor:pointer;
    font-family:inherit;
    font-size:17px;
    transition:
      transform .2s ease,
      background .2s ease,
      border-color .2s ease,
      box-shadow .2s ease;
  }

  button:hover{
    transform:translateY(-2px);
    background:rgba(214,180,106,.13);
    border-color:rgba(240,217,155,.75);
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }

  button:active{
    transform:translateY(0);
  }

  .nav{
    display:flex;
    gap:12px;
    max-width:720px;
    margin:34px auto 0;
  }

  .nav button{
    font-size:15px;
  }

  .nav .back{
    flex:1;
  }

  .nav .next{
    flex:2;
  }

  .note{
    text-align:center;
    color:#777873;
    font-size:12px;
    margin-top:25px;
  }

  .ending{
    text-align:center;
    padding:30px 5px 10px;
  }

  .ending h3{
    color:var(--gold-light);
    font-size:27px;
    margin:0 0 12px;
  }

  .ending p{
    color:#ddd9cf;
    line-height:2;
  }

  @media(max-width:600px){

    .wrap{
      padding:15px 10px 35px;
    }

    .top{
      padding:34px 20px 23px;
    }

    h1{
      font-size:28px;
    }

    main{
      padding:38px 22px 30px;
    }

    .story p{
      font-size:17px;
    }

    h2{
      font-size:24px;
    }

    .nav{
      flex-direction:column;
    }

    .nav .back,
    .nav .next{
      flex:auto;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <section class="book">

    <header class="top">

      <div class="mark">⚔︎</div>

      <h1>ما وراء باب الاستقبال</h1>

      <div id="chapterLabel">

    </header>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

    <main id="app"></main>

  </section>

</div>

   الفصل الأول

{
title:"يوم يشبه كل الأيام",

content:`

<p>كنت أظن أنني أعرف هذا المكان أكثر مما ينبغي.</p>

<p>أعرف الباب الذي يدخل منه الجميع، والباب الآخر الذي يخرج منه من انتهى من تدريبه، وأعرف الأصوات التي تأتي من الداخل حتى لو لم أكن أراها.</p>

<p>أعرف صوت السيوف حين تتلاقى.</p>

<p>أعرف صوت خطوات شخص يركض قبل أن أراه.</p>

<p>وأعرف ذلك الصمت القصير الذي يأتي بعد انتهاء الجولة.</p>

<p>كنت أظن أن عملي هنا بسيط. استقبال، أسئلة، مواعيد، وجوه تتكرر، وأيام تشبه بعضها حتى يصعب تذكر الفرق بينها.</p>

<p>لكن في ذلك اليوم، حدث شيء صغير جدًا.</p>

<p>شيء كان من السهل أن أتجاهله.</p>

<p>رفعت عيني نحو الزجاج أمامي، فرأيت انعكاسي كما اعتدت.</p>

<p>ثم رأيت خلف انعكاسي بابًا.</p>

<p>بابًا لم يكن موجودًا في المكان.</p>

<p>أغمضت عيني للحظة.</p>

<p>وعندما فتحتهما، اختفى.</p>

<p>ضحكت على نفسي، وعدت إلى عملي.</p>

<p>لم أكن أعرف أنني بعد ساعات قليلة سأبدأ بالتشكيك في شيء واحد فقط:</p>

<p class="gold">
هل أنا التي أعيش الحكاية... أم أن الحكاية كانت تعيش معي منذ البداية؟
</p>

`
},

/* =========================

content:`

<p>أو هكذا بدا لي.</p>

<p>في إحدى اللحظات، وبينما كنت أرتب شيئًا على المكتب، سمعت صوتًا خافتًا.</p>

<p>ثم ظهر باب كامل، بإطار ذهبي قديم، وعلى وسطه نقش سيفين متقاطعين.</p>

<p>تراجعت خطوة.</p>

<p class="masked dialogue">

<p>جاء الصوت من خلف الباب.</p>

<p>ومن الجهة الأخرى سمعت أصوات السيوف القادمة من صالة المبارزة.</p>

<p>ثم ساد الصمت.</p>

`,

choices:[

"⚔️ أفتح الباب.",

[

{
title:"الباب",
route:"a",

content:`

<p>وضعت يدي على المقبض.</p>

<p>كان باردًا.</p>

<p>فتحت الباب.</p>

<p class="masked dialogue">

<p class="masked dialogue">

title:"المدينة التي تعرفني",

content:`

<p>لم أعد أعرف أي الطريقين أوصلني إلى هذه المدينة.</p>

<p>لكن النتيجة كانت واحدة.</p>

<p>مدينة حجرية تتنفس كأنها حيّة، ومحلات تعرض الدروع والسيوف، وساعات غريبة لا تتفق عقاربها على وقت واحد.</p>

<p>التفتُّ.</p>

<p>لم يكن يحمل سيفًا في يده، لكن عند خصره كان يتدلى غمدٌ أسود طويل. لم أستطع رؤية السيف بداخله، لكنني لم أحتج إلى ذلك لأعرف أنه موجود.</p>

<p class="gold">

/* =========================
   الفصل السادس - المسار الأول

{

content:`

/* =========================
   مسارات القصة
========================= */

const routePages = {

  p3a:2,
  p3b:3,

  p5a:5,
  p5b:8

};


/* =========================
   تصفير نسخة الاختبار القديمة
========================= */

const STORY_VERSION = "experimental-design-v3";

if(
  localStorage.getItem("mysteryStoryVersion")
  !== STORY_VERSION
){

  localStorage.removeItem("mysteryCurrent");
  localStorage.removeItem("mysteryHistory");
  localStorage.removeItem("mysteryChoices");

  localStorage.setItem(
    "mysteryStoryVersion",
    STORY_VERSION
  );

}


let current =
  Number(
    localStorage.getItem("mysteryCurrent")
    || 0
  );


let history =
  JSON.parse(
    localStorage.getItem("mysteryHistory")
    || "[]"
  );


let choices =
  JSON.parse(
    localStorage.getItem("mysteryChoices")
    || "{}"
  );


/* =========================
   حفظ التقدم
========================= */

function save(){

  localStorage.setItem(
    "mysteryCurrent",
    current
  );

  localStorage.setItem(
    "mysteryHistory",
    JSON.stringify(history)
  );

  localStorage.setItem(
    "mysteryChoices",
    JSON.stringify(choices)
  );

}


/* =========================
   الاختيار
========================= */

function choose(target,label){

  choices[current] = label;

  history.push(current);

  current = routePages[target];

  save();

  render();

}


/* =========================
   الانتقال بين الفصول
========================= */

function next(){

  const nextMap = {

    0:1,

    2:4,
    3:4,

    4:null,

    5:6,
    6:7,
    7:9,

    8:10,
    9:11,
    10:11,

    11:12,
    12:13,
    13:14,
    14:15,
    15:16,
    16:17,
    17:18

  };


  if(
    nextMap[current] !== undefined
    &&
    nextMap[current] !== null
  ){

    current =
      nextMap[current];

    save();

    render();

  }

}


/* =========================
   زر الرجوع
========================= */

function back(){

  if(history.length){

    current =
      history.pop();

    save();

    render();

  }

  else if(current > 0){

    current--;

    save();

    render();

  }

}


/* =========================
   أسماء الفصول
========================= */

function getChapterLabel(){

  const chapterLabels = {

    0:"الفصل الأول",

    1:"الفصل الثاني",

    2:"الفصل الثالث — المسار الأول",

    3:"الفصل الثالث — المسار الثاني",

    4:"الفصل الرابع",

    5:"الفصل الخامس — الخيار الأول",

    6:"الفصل السادس — الخيار الأول",

    7:"الفصل السابع — الخيار الأول",

    8:"الفصل الخامس — الخيار الثاني",

    9:"الفصل السادس — الخيار الثاني",

    10:"الفصل السابع — الخيار الثاني",

    11:"الفصل الثامن",

    12:"الفصل التاسع",

    13:"الفصل العاشر",

    14:"الفصل الحادي عشر",

    15:"الفصل الثاني عشر",

    16:"الفصل الثالث عشر",

    17:"الفصل الرابع عشر",

    18:"الفصل الخامس عشر"

  };

  /*
    التصحيح:
    لأن ترتيب المصفوفة يحتوي على الفروع،
    فالفصول الأخيرة تحتاج ترقيمًا خاصًا.
  */

  if(current === 15){
    return "الفصل الخامس عشر";
  }

  if(current === 16){
    return "الفصل السادس عشر";
  }

  if(current === 17){
    return "الفصل السابع عشر";
  }

  if(current === 18){
    return "الفصل الثامن عشر";
  }

  return chapterLabels[current] || "الفصل";

}


/* =========================
   عرض الصفحة
========================= */

function render(){

  const p =
    pages[current];


  document.getElementById(
    "chapterLabel"
  ).textContent =
    getChapterLabel();


  let html =
    `<h2>${p.title}</h2>
     <div class="story">
       ${p.content}
     </div>`;


  /* الاختيارات */

  if(p.choices){

    html +=
      `<div class="choiceTitle">
        اختاري كيف تواصلين الحكاية
      </div>

      <div class="choices">`;


    p.choices.forEach(c => {

      html +=
        `<button
          onclick="choose(
            '${c[1]}',
            '${c[0].replace(/'/g,"’")}'
          )"
        >
          ${c[0]}
        </button>`;

    });


    html +=
      `</div>`;

  }


  /* التنقل */

  else if(!p.end){

    html +=
      `<div class="nav">

        <button
          class="back"
          onclick="back()"
        >
          ↩ العودة
        </button>

        <button
          class="next"
          onclick="next()"
        >
          متابعة الحكاية ←
        </button>

      </div>`;

  }


  /* النهاية */

  else{

    html +=
      `<div class="ending">

        <h3>
          النهاية... أم بداية أخرى؟
        </h3>

        <p>
          انتهت الحكاية هنا، لكن الباب لم يُغلق تمامًا.
        </p>

        <button
          onclick="
            current=0;
            history=[];
            choices={};
            save();
            render();
          "
        >
          إعادة الحكاية من البداية
        </button>

      </div>`;

  }


  html +=
    `<div class="note">
      الاختيارات تُحفظ على هذا الجهاز.
    </div>`;


  document.getElementById(
    "app"
  ).innerHTML =
    html;


  document.getElementById(
    "progressBar"
  ).style.width =
    (
      (current + 1)
      /
      pages.length
      *
      100
    )
    + "%";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* تشغيل الموقع */

render();

</script>

</body>
</html>
